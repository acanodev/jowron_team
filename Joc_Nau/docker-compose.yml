services:
  joc_nau_frontend:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${FRONTEND_PORT_HTTP:-80}:80"
      - "${FRONTEND_PORT_HTTPS:-443}:443"
    volumes:
      - ./joc:/usr/share/nginx/html
    networks:
      - joc_nau_network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Comanda per afegir certificats SSL autosignats al contenidor.
    # command: >-
    #   sh -c "apk add --no-cache openssl && mkdir -p /etc/nginx/ssl && openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/nginx/ssl/server.key -out /etc/nginx/ssl/server.crt -subj '/C=ES/ST=Barcelona/L=Barcelona/O=Joc_Nau/CN=localhost' 2>/dev/null && nginx -g 'daemon off;'"
networks:
  joc_nau_network: